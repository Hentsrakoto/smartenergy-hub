server:
  port: ${COLLECTOR_SERVER_PORT:8081}

spring:
  application:
    name: collector-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 3000ms
  jackson:
    serialization:
      write-dates-as-timestamps: false

smartenergy:
  stream:
    name: ${REDIS_STREAM_NAME:energy-measurements}

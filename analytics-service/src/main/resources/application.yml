server:
  port: ${ANALYTICS_SERVER_PORT:8084}
  address: 127.0.0.1
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  server:
    port: ${ANALYTICS_MANAGEMENT_PORT:9084}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

spring:
  profiles:
    default: local
  application:
    name: analytics-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/smartenergy}
      auto-index-creation: true
  cassandra:
    keyspace-name: ${CASSANDRA_KEYSPACE:smartenergy}
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_LOCAL_DATACENTER:datacenter1}
    # Le schéma est géré explicitement par scripts/init-cassandra.cql (idempotent).
    # Spring ne doit donc jamais créer, modifier ou supprimer des tables.
    schema-action: none
    request:
      timeout: 5s
    connection:
      connect-timeout: 5s
      init-query-timeout: 5s
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ==============================================================================
# Docker Compose — Infrastructure Dépendances SmartEnergy Hub
#
# RÈGLES D'EXÉCUTION DU PROJET :
# 1. Spring Boot (Collector, Storage) et Streamlit tournent SUR L'HÔTE (hors Docker).
# 2. Ce fichier Compose gère les dépendances conteneurisées du projet :
#    - Redis Streams (buffer de transport d'événements)
#    - MongoDB (métadonnées, alertes, synthèses quotidiennes)
#    - Cassandra (mesures temporelles) et son initialiseur CQL idempotent
# 3. Les bases sont accessibles depuis l'hôte uniquement via 127.0.0.1.
# ==============================================================================

services:
  smartenergy-simulator:
    profiles: ["simulation"]
    build:
      context: ./simulator
    image: smartenergy-simulator:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smartenergy-network
    environment:
      PYTHONUNBUFFERED: "1"
      NO_PROXY: "host.docker.internal,localhost,127.0.0.1"
    command:
      - "--config"
      - "config.json"
      - "--url"
      - "${SIMULATOR_TARGET_URL:-http://host.docker.internal:8081/api/measurements}"
      - "--duration"
      - "${SIMULATOR_DURATION_SECONDS:-120}"
    restart: "no"

  smartenergy-redis:
    image: redis:7.4-alpine
    container_name: smartenergy-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Port hôte 6380 pour ne pas entrer en conflit avec tsidika-redis (port 6379)
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - smartenergy_redis_data:/data
    networks:
      - smartenergy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  smartenergy-mongo:
    image: mongo:7.0-jammy
    container_name: smartenergy-mongo
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-smartenergy}
    volumes:
      - smartenergy_mongo_data:/data/db
    networks:
      - smartenergy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  smartenergy-cassandra:
    image: cassandra:4.1
    container_name: smartenergy-cassandra
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-SmartEnergy Hub}
      CASSANDRA_DC: ${CASSANDRA_LOCAL_DATACENTER:-datacenter1}
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - smartenergy_cassandra_data:/var/lib/cassandra
    networks:
      - smartenergy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cqlsh", "127.0.0.1", "9042", "-e", "SELECT release_version FROM system.local;"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  smartenergy-cassandra-init:
    image: cassandra:4.1
    depends_on:
      smartenergy-cassandra:
        condition: service_healthy
    volumes:
      - ./scripts/init_cassandra.cql:/scripts/init_cassandra.cql:ro
    networks:
      - smartenergy-network
    command: ["cqlsh", "smartenergy-cassandra", "9042", "-f", "/scripts/init_cassandra.cql"]
    restart: "no"

volumes:
  smartenergy_redis_data:
    name: smartenergy_redis_data
  smartenergy_mongo_data:
    name: smartenergy_mongo_data
  smartenergy_cassandra_data:
    name: smartenergy_cassandra_data

networks:
  smartenergy-network:
    name: smartenergy-network
    driver: bridge

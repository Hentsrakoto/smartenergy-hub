# ==============================================================================
# Docker Compose — SmartEnergy Hub
#
# RÈGLES D'EXÉCUTION DU PROJET :
# 1. Depuis la migration validée le 2026-11-01, applications et bases sont dans Docker.
# 2. Les conteneurs et volumes des bases existantes sont conservés :
#    - Redis Streams (buffer de transport d'événements)
#    - MongoDB (métadonnées, alertes, synthèses quotidiennes)
#    - Cassandra (mesures temporelles) et son initialiseur CQL idempotent
# 3. Les bases sont accessibles depuis l'hôte uniquement via 127.0.0.1.
# ==============================================================================

services:
  collector-service:
    build:
      context: .
      dockerfile: collector-service/Dockerfile
    image: smartenergy-collector:local
    container_name: smartenergy-collector
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-energy-measurements}
    ports:
      - "127.0.0.1:${COLLECTOR_SERVER_PORT:-8081}:8080"
    networks: [smartenergy-network]
    depends_on:
      smartenergy-redis:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    image: smartenergy-analytics:local
    container_name: smartenergy-analytics
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_DATABASE: ${MONGO_DATABASE:-smartenergy}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-smartenergy}
      CASSANDRA_LOCAL_DATACENTER: ${CASSANDRA_LOCAL_DATACENTER:-datacenter1}
    ports:
      - "127.0.0.1:${ANALYTICS_SERVER_PORT:-8084}:8080"
    networks: [smartenergy-network]
    depends_on:
      smartenergy-mongo:
        condition: service_healthy
      smartenergy-cassandra-init:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped

  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    image: smartenergy-storage:local
    container_name: smartenergy-storage
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_DATABASE: ${MONGO_DATABASE:-smartenergy}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-smartenergy}
      CASSANDRA_LOCAL_DATACENTER: ${CASSANDRA_LOCAL_DATACENTER:-datacenter1}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-energy-measurements}
      REDIS_STREAM_GROUP: ${REDIS_STREAM_GROUP:-storage-group}
    ports:
      - "127.0.0.1:${STORAGE_SERVER_PORT:-8083}:8080"
    networks: [smartenergy-network]
    depends_on:
      smartenergy-redis:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: smartenergy-dashboard:local
    container_name: smartenergy-dashboard
    environment:
      SMARTENERGY_STORAGE_URL: http://storage-service:8080
      SMARTENERGY_ANALYTICS_URL: http://analytics-service:8080
    ports:
      - "127.0.0.1:${STREAMLIT_SERVER_PORT:-8501}:8501"
    networks: [smartenergy-network]
    depends_on:
      storage-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped

  smartenergy-simulator:
    profiles: ["simulation"]
    build:
      context: ./simulator
    image: smartenergy-simulator:local
    networks:
      - smartenergy-network
    environment:
      PYTHONUNBUFFERED: "1"
      NO_PROXY: "collector-service,localhost,127.0.0.1"
    command:
      - "--config"
      - "config.json"
      - "--url"
      - "${SIMULATOR_TARGET_URL:-http://collector-service:8080/api/measurements}"
      - "--duration"
      - "${SIMULATOR_DURATION_SECONDS:-120}"
    restart: "no"

  smartenergy-redis:
    image: redis:7.4-alpine
    container_name: smartenergy-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Port hôte 6380 pour ne pas entrer en conflit avec tsidika-redis (port 6379)
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - smartenergy_redis_data:/data
    networks:
      - smartenergy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  smartenergy-mongo:
    image: mongo:7.0-jammy
    container_name: smartenergy-mongo
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-smartenergy}
    volumes:
      - smartenergy_mongo_data:/data/db
    networks:
      - smartenergy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  smartenergy-cassandra:
    image: cassandra:4.1
    container_name: smartenergy-cassandra
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-SmartEnergy Hub}
      CASSANDRA_DC: ${CASSANDRA_LOCAL_DATACENTER:-datacenter1}
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - smartenergy_cassandra_data:/var/lib/cassandra
    networks:
      - smartenergy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cqlsh", "127.0.0.1", "9042", "-e", "SELECT release_version FROM system.local;"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  smartenergy-cassandra-init:
    image: cassandra:4.1
    depends_on:
      smartenergy-cassandra:
        condition: service_healthy
    volumes:
      - ./scripts/init-cassandra.cql:/scripts/init-cassandra.cql:ro
    networks:
      - smartenergy-network
    command: ["cqlsh", "smartenergy-cassandra", "9042", "-f", "/scripts/init-cassandra.cql"]
    restart: "no"

volumes:
  smartenergy_redis_data:
    name: smartenergy_redis_data
  smartenergy_mongo_data:
    name: smartenergy_mongo_data
  smartenergy_cassandra_data:
    name: smartenergy_cassandra_data

networks:
  smartenergy-network:
    name: smartenergy-network
    driver: bridge
